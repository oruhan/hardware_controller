[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/oruhan/hardware_controller"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[workspace.dependencies]
# The UI uses APIs queued for xengui 0.2.8/xenframe 0.1.2. Pin the exact
# upstream revision so clean builds are reproducible until those releases land.
xengui = { git = "https://github.com/randseas/xengui.git", rev = "fbd2255123d43e8e84036c23a4e45530ceb5bc34" }
xenframe = { git = "https://github.com/randseas/xengui.git", rev = "fbd2255123d43e8e84036c23a4e45530ceb5bc34" }
xengui-icons = { git = "https://github.com/randseas/xengui.git", rev = "fbd2255123d43e8e84036c23a4e45530ceb5bc34" }

gui = { path = "crates/gui" }
razer = { path = "crates/razer" }
devices = { path = "crates/devices" }

thiserror = "2.0.20"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch."https://github.com/randseas/xengui.git"]
xengui = { path = "vendor/xengui" }
